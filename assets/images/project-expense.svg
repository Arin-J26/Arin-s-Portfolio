<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#F4EBD8"/>
  <!-- Ledger grid lines -->
  <line x1="40" y1="0" x2="40" y2="380" stroke="#C65D32" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="0" x2="44" y2="380" stroke="#C65D32" stroke-width="0.8" opacity="0.6"/>
  
  <g stroke="#29231D" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
  </g>

  <!-- Ledger Card Header -->
  <text x="60" y="32" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#29231D">EXPENSE &amp; BUDGET LEDGER</text>
  <text x="540" y="32" font-family="'Courier New', monospace" font-size="12" fill="#68734A" text-anchor="end">FOLIO #2024</text>

  <!-- Mini Chart / Bar Graphs -->
  <rect x="60" y="60" width="240" height="150" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
  <text x="75" y="80" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D">MONTHLY ALLOCATION</text>

  <!-- Bar columns -->
  <rect x="80" y="140" width="28" height="55" fill="#C65D32"/>
  <rect x="120" y="115" width="28" height="80" fill="#68734A"/>
  <rect x="160" y="95" width="28" height="100" fill="#D9B65D"/>
  <rect x="200" y="130" width="28" height="65" fill="#29231D"/>
  <rect x="240" y="150" width="28" height="45" fill="#B83A2C"/>

  <text x="94" y="205" font-family="'Courier New', monospace" font-size="9" fill="#29231D" text-anchor="middle">Books</text>
  <text x="134" y="205" font-family="'Courier New', monospace" font-size="9" fill="#29231D" text-anchor="middle">Tech</text>
  <text x="174" y="205" font-family="'Courier New', monospace" font-size="9" fill="#29231D" text-anchor="middle">Food</text>
  <text x="214" y="205" font-family="'Courier New', monospace" font-size="9" fill="#29231D" text-anchor="middle">Hostel</text>
  <text x="254" y="205" font-family="'Courier New', monospace" font-size="9" fill="#29231D" text-anchor="middle">Misc</text>

  <!-- Summary Card -->
  <rect x="320" y="60" width="240" height="150" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
  <text x="335" y="85" font-family="'Courier New', monospace" font-size="11" fill="#5A4E43">TOTAL SPENT (OCT)</text>
  <text x="335" y="115" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#C65D32">&#8377; 4,850.00</text>
  <line x1="335" y1="130" x2="535" y2="130" stroke="#29231D" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="335" y="152" font-family="'Courier New', monospace" font-size="11" fill="#68734A">SAVINGS GOAL: 82% MET</text>
  <text x="335" y="172" font-family="'Courier New', monospace" font-size="11" fill="#29231D">LOCAL STORAGE PERSISTENCE</text>
  <text x="335" y="192" font-family="'Courier New', monospace" font-size="10" fill="#5A4E43">> FAST VANILLA JS ENGINE</text>

  <!-- Vintage Stamp -->
  <g transform="translate(180, 240) rotate(-4)">
    <rect x="0" y="0" width="260" height="85" fill="#FFFFFF" stroke="#29231D" stroke-width="2"/>
    <text x="15" y="28" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#29231D">TRANSACTION REGISTER</text>
    <text x="15" y="50" font-family="'Courier New', monospace" font-size="11" fill="#5A4E43">Categorized Analytics &amp; Budgets</text>
    <text x="15" y="70" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#68734A">&#10003; CSV EXPORT &amp; FILTER READY</text>
  </g>
</svg>