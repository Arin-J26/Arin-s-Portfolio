<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#29231D" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="#E7D9BD"/>
  <rect width="600" height="380" fill="url(#grid1)"/>
  
  <!-- Browser window frame retro brutalist style -->
  <rect x="30" y="30" width="540" height="320" fill="#F4EBD8" stroke="#29231D" stroke-width="2.5"/>
  <rect x="30" y="30" width="540" height="36" fill="#D9B65D" stroke="#29231D" stroke-width="2.5"/>
  <circle cx="50" cy="48" r="6" fill="#C65D32" stroke="#29231D" stroke-width="1.5"/>
  <circle cx="70" cy="48" r="6" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
  <circle cx="90" cy="48" r="6" fill="#68734A" stroke="#29231D" stroke-width="1.5"/>
  <rect x="120" y="38" width="320" height="20" fill="#F4EBD8" stroke="#29231D" stroke-width="1.2"/>
  <text x="130" y="52" font-family="'Courier New', monospace" font-size="11" fill="#29231D">https://arinjain.dev/portfolio-v1</text>
  
  <!-- Content inside window -->
  <rect x="55" y="85" width="260" height="40" fill="#29231D"/>
  <text x="70" y="112" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#F4EBD8">ARIN JAIN</text>
  <text x="55" y="145" font-family="'Courier New', monospace" font-size="12" fill="#C65D32" font-weight="bold">> VINTAGE DIGITAL MAGAZINE & SCRAPBOOK</text>
  
  <!-- Editorial columns mockup -->
  <line x1="55" y1="160" x2="330" y2="160" stroke="#29231D" stroke-width="1.5"/>
  <rect x="55" y="175" width="130" height="8" fill="#29231D" opacity="0.6"/>
  <rect x="55" y="190" width="120" height="6" fill="#29231D" opacity="0.4"/>
  <rect x="55" y="202" width="130" height="6" fill="#29231D" opacity="0.4"/>
  <rect x="55" y="214" width="110" height="6" fill="#29231D" opacity="0.4"/>
  
  <rect x="195" y="175" width="130" height="8" fill="#29231D" opacity="0.6"/>
  <rect x="195" y="190" width="125" height="6" fill="#29231D" opacity="0.4"/>
  <rect x="195" y="202" width="115" height="6" fill="#29231D" opacity="0.4"/>
  <rect x="195" y="214" width="130" height="6" fill="#29231D" opacity="0.4"/>

  <!-- Right side polaroid / stamp card -->
  <g transform="translate(360, 95) rotate(4)">
    <rect x="0" y="0" width="180" height="210" fill="#FFFFFF" stroke="#29231D" stroke-width="2"/>
    <rect x="15" y="15" width="150" height="135" fill="#68734A"/>
    <circle cx="90" cy="75" r="35" fill="#D9B65D"/>
    <polygon points="90,45 100,70 125,70 105,85 112,110 90,95 68,110 75,85 55,70 80,70" fill="#29231D"/>
    <text x="90" y="180" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#29231D" text-anchor="middle">ISSUE NO. 01</text>
  </g>
  
  <!-- Stamp -->
  <circle cx="100" cy="275" r="32" fill="none" stroke="#C65D32" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="100" y="278" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#C65D32" text-anchor="middle">HTML5 • CSS3 • JS</text>
</svg>