<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9B65D"/>
      <stop offset="100%" stop-color="#C65D32"/>
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="#E7D9BD"/>
  
  <!-- Weather Barometer / Antique Gauges Frame -->
  <rect x="30" y="30" width="540" height="320" fill="#F4EBD8" stroke="#29231D" stroke-width="2.5"/>
  <rect x="45" y="45" width="510" height="40" fill="#29231D"/>
  <text x="60" y="70" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#F4EBD8">METEOROLOGICAL OBSERVER // NEW DELHI STATION</text>
  <text x="540" y="70" font-family="'Courier New', monospace" font-size="12" fill="#D9B65D" text-anchor="end">LIVE FEED</text>

  <!-- Big Sun / Weather Icon -->
  <g transform="translate(70, 115)">
    <circle cx="65" cy="65" r="45" fill="url(#sunGrad)" stroke="#29231D" stroke-width="2"/>
    <!-- Cloud cutting across -->
    <path d="M 40,85 A 25,25 0 0,1 80,65 A 30,30 0 0,1 125,75 A 22,22 0 0,1 120,95 L 35,95 Z" fill="#F4EBD8" stroke="#29231D" stroke-width="2"/>
    <text x="160" y="55" font-family="Georgia, serif" font-size="44" font-weight="900" fill="#29231D">28&deg;C</text>
    <text x="160" y="80" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#C65D32">PARTLY CLOUDY • 1013 hPa</text>
    <text x="160" y="100" font-family="'Courier New', monospace" font-size="11" fill="#5A4E43">HUMIDITY: 54% | WIND: 12 KM/H WNW</text>
  </g>

  <!-- 5-day forecast cards -->
  <g transform="translate(60, 240)">
    <!-- Day 1 -->
    <rect x="0" y="0" width="85" height="85" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
    <text x="42" y="22" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">MON</text>
    <circle cx="42" cy="45" r="12" fill="#D9B65D" stroke="#29231D" stroke-width="1"/>
    <text x="42" y="72" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">29&deg; / 18&deg;</text>

    <!-- Day 2 -->
    <rect x="100" y="0" width="85" height="85" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
    <text x="142" y="22" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">TUE</text>
    <circle cx="142" cy="45" r="12" fill="#C65D32" stroke="#29231D" stroke-width="1"/>
    <text x="142" y="72" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">31&deg; / 19&deg;</text>

    <!-- Day 3 -->
    <rect x="200" y="0" width="85" height="85" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
    <text x="242" y="22" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">WED</text>
    <circle cx="242" cy="45" r="12" fill="#68734A" stroke="#29231D" stroke-width="1"/>
    <text x="242" y="72" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">26&deg; / 16&deg;</text>

    <!-- Day 4 -->
    <rect x="300" y="0" width="85" height="85" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
    <text x="342" y="22" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">THU</text>
    <circle cx="342" cy="45" r="12" fill="#D9B65D" stroke="#29231D" stroke-width="1"/>
    <text x="342" y="72" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">28&deg; / 17&deg;</text>

    <!-- Day 5 -->
    <rect x="400" y="0" width="85" height="85" fill="#E7D9BD" stroke="#29231D" stroke-width="1.5"/>
    <text x="442" y="22" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">FRI</text>
    <circle cx="442" cy="45" r="12" fill="#C65D32" stroke="#29231D" stroke-width="1"/>
    <text x="442" y="72" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#29231D" text-anchor="middle">30&deg; / 19&deg;</text>
  </g>
</svg>