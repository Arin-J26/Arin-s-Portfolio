<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#E7D9BD"/>
  <rect x="25" y="25" width="450" height="450" fill="#F4EBD8" stroke="#29231D" stroke-width="2"/>
  
  <!-- Candlestick chart retro vintage style -->
  <g stroke="#29231D" stroke-width="0.5" opacity="0.25">
    <line x1="40" y1="100" x2="460" y2="100"/>
    <line x1="40" y1="170" x2="460" y2="170"/>
    <line x1="40" y1="240" x2="460" y2="240"/>
    <line x1="40" y1="310" x2="460" y2="310"/>
  </g>

  <!-- Candlesticks -->
  <!-- 1 Bullish -->
  <line x1="80" y1="220" x2="80" y2="280" stroke="#68734A" stroke-width="2"/>
  <rect x="70" y="235" width="20" height="35" fill="#68734A" stroke="#29231D" stroke-width="1.5"/>

  <!-- 2 Bearish -->
  <line x1="130" y1="200" x2="130" y2="270" stroke="#C65D32" stroke-width="2"/>
  <rect x="120" y="210" width="20" height="40" fill="#C65D32" stroke="#29231D" stroke-width="1.5"/>

  <!-- 3 Bullish -->
  <line x1="180" y1="180" x2="180" y2="250" stroke="#68734A" stroke-width="2"/>
  <rect x="170" y="195" width="20" height="40" fill="#68734A" stroke="#29231D" stroke-width="1.5"/>

  <!-- 4 Bullish breakout -->
  <line x1="230" y1="130" x2="230" y2="220" stroke="#68734A" stroke-width="2"/>
  <rect x="220" y="150" width="20" height="55" fill="#68734A" stroke="#29231D" stroke-width="1.5"/>

  <!-- 5 Retest -->
  <line x1="280" y1="140" x2="280" y2="210" stroke="#C65D32" stroke-width="2"/>
  <rect x="270" y="160" width="20" height="30" fill="#C65D32" stroke="#29231D" stroke-width="1.5"/>

  <!-- 6 Huge Rally -->
  <line x1="330" y1="90" x2="330" y2="180" stroke="#68734A" stroke-width="2"/>
  <rect x="320" y="105" width="20" height="60" fill="#68734A" stroke="#29231D" stroke-width="1.5"/>

  <!-- 7 Consolidation -->
  <line x1="380" y1="80" x2="380" y2="140" stroke="#D9B65D" stroke-width="2"/>
  <rect x="370" y="95" width="20" height="25" fill="#D9B65D" stroke="#29231D" stroke-width="1.5"/>

  <!-- Trendline -->
  <path d="M 60,265 Q 220,180 430,90" fill="none" stroke="#29231D" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Title & annotations -->
  <text x="50" y="65" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#29231D">MARKETS &amp; QUANTITATIVE ANALYTICS</text>
  <text x="50" y="380" font-family="'Courier New', monospace" font-size="12" fill="#5A4E43">INDICATORS: VOLATILITY • MOMENTUM • STATISTICAL ARB</text>
  <text x="50" y="405" font-family="'Courier New', monospace" font-size="12" fill="#C65D32" font-weight="bold">> Algorithmic models &amp; risk calculations</text>
  
  <!-- Stamp -->
  <g transform="translate(320, 390) rotate(-5)">
    <rect x="0" y="0" width="120" height="35" fill="none" stroke="#68734A" stroke-width="2"/>
    <text x="60" y="23" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#68734A" text-anchor="middle">DATA-DRIVEN</text>
  </g>
</svg>